//    11l
     function minMax(nums) {
        const result = {
            min: nums[0],
            max: nums[0]
        };

        for (let i = 0; i < nums.length; i++) {
            const value = nums[i];

            if (value < result.min) {
                result.min = value;
            }
            if (value > result.max) {
                result.max = value;
            }
        }
        return result;
     }
    /*

    // 11m
     function minMax(nums) {
        const result = {
            min: null,
            max: null
        };

        for (let i = 0; i < nums.length; i++) {
            const value = nums[i];

            if (result.min === null || value < result.min) {
                result.min = value;
            }

            if (result.max === null || value < result.max) {
                result.max = value;
            }
        }
        return result;
     }

    // 11n
    function countWords(words) {
        const result = {};

        for (let i = 0; i < words.length; i++) {
            const word = words[i];
            

             // result[word] adds/accesses a property using whatever is
            // saved inside the 'word' variable.
            // If word = 'apple', result[word] will do result['apple']
            // If word = 'grape', result[word] will do result['grape']

            
            if (!result[word]) {
                result[word] = 1;
            } else {
                result[word]++;
            }
        }
        return result;
    }
